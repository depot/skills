interface:
  display_name: "Depot CI"
  short_description: "Run, debug, and migrate Depot CI workflows"
  icon_small: "./assets/depot-icon-small-compact.png"
  icon_large: "./assets/depot-icon-large-compact.png"
  brand_color: "#46A75A"
  default_prompt: "Use $depot-ci to find my most recent failed Depot CI run and explain the failure."
policy:
  products:
    - "chatgpt"
    - "codex"
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "depot"
      description: "Depot MCP server"
      transport: "streamable_http"
      url: "https://mcp.depot.dev/mcp"
