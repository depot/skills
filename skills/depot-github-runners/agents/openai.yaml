interface:
  display_name: "Depot GitHub Runners"
  short_description: "Depot GitHub Actions runners and job analysis"
  icon_small: "./assets/depot-icon-small-compact.png"
  icon_large: "./assets/depot-icon-large-compact.png"
  brand_color: "#46A75A"
  default_prompt: "Use $depot-github-runners to find my failed GitHub Actions jobs on Depot runners from the last day."
policy:
  products:
    - "chatgpt"
    - "codex"
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "depot"
      description: "Depot MCP server"
      transport: "streamable_http"
      url: "https://mcp.depot.dev/mcp"
