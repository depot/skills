interface:
  display_name: "Depot General"
  short_description: "Depot CLI, authentication, projects, and billing"
  icon_small: "./assets/depot-icon-small-compact.png"
  icon_large: "./assets/depot-icon-large-compact.png"
  brand_color: "#46A75A"
  default_prompt: "Use $depot-general to list my Depot projects and their settings."
policy:
  products:
    - "chatgpt"
    - "codex"
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "depot"
      description: "Depot MCP server"
      transport: "streamable_http"
      url: "https://mcp.depot.dev/mcp"
