interface:
  display_name: "Depot Container Builds"
  short_description: "Run and debug Depot container builds"
  icon_small: "./assets/depot-icon-small-compact.png"
  icon_large: "./assets/depot-icon-large-compact.png"
  brand_color: "#46A75A"
  default_prompt: "Use $depot-container-builds to find my most recent failed container build and explain the failure."
policy:
  products:
    - "CHAT"
    - "CODEX"
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "depot"
      description: "Depot MCP server"
      transport: "streamable_http"
      url: "https://mcp.depot.dev/mcp"
